name: Lint Python Code

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ] 

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install pylint black

      - name: Run pylint
        run: |
          pylint hello_world.py

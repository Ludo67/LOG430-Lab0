global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "fastapi-app"
    static_configs:
      - targets:
          - "log430-stock-1:8000"
          - "log430-stock-2:8000"
          - "log430-stock-3:8000"

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

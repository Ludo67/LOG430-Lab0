version: '3.8'

services:
  fastapi-app-1:
    build: .
    container_name: log430-stock-1
    ports:
      - "8001:8000"
    environment:
      - PYTHONPATH=/app

  fastapi-app-2:
    build: .
    container_name: log430-stock-2
    ports:
      - "8002:8000"
    environment:
      - PYTHONPATH=/app

  fastapi-app-3:
    build: .
    container_name: log430-stock-3
    ports:
      - "8003:8000"
    environment:
      - PYTHONPATH=/app

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi-app-1
      - fastapi-app-2
      - fastapi-app-3

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter
    command:
      - -nginx.scrape-uri=http://nginx/nginx_status
    ports:
      - 9113:9113
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - fastapi-app-1
      - fastapi-app-2
      - fastapi-app-3

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    ports:
      - "9100:9100"

networks:
  default:
    name: log430-network

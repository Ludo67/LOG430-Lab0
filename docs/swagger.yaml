components:
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
info:
  title: API Gateway (KrakenD)
  version: 1.0.0
openapi: 3.0.0
paths:
  /clients/:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                nom:
                  type: string
                prenom:
                  type: string
                email:
                  type: string
                adresse:
                  type: string
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Créer un client
      tags:
      - Clients
  /clients/{client_id}:
    get:
      parameters:
      - in: path
        name: client_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Récupérer un client par ID
      tags:
      - Clients
  /panier/:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: integer
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Créer un panier
      tags:
      - Panier
  /panier/panier/{panier_id}:
    get:
      parameters:
      - in: path
        name: panier_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Obtenir un panier par ID
      tags:
      - Panier
  /panier/panier/{panier_id}/checkout:
    post:
      parameters:
      - in: path  
        name: panier_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Valider le panier
      tags:
      - Panier
  /panier/{panier_id}/produit:
    post:
      parameters:
      - in: path  
        name: panier_id
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                magasin_id:
                  type: integer
                quantite:
                  type: integer
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Ajouter un produit au panier
      tags:
      - Panier
  /reporting/dashboard:
    get:
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Afficher le tableau de bord
      tags:
      - Rapports
  /reporting/ruptures:
    get:
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Afficher les ruptures de stock
      tags:
      - Rapports
  /reporting/ventes:
    get:
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Afficher les ventes
      tags:
      - Rapports
  /restock/stock_par_magasin:
    get:
      parameters:
      - in: query
        name: magasin_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Afficher le stock par magasin
      tags:
      - Réapprovisionnement
  /restock/transferer:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                produit_id:
                  type: string
                quantite:
                  type: integer
                magasin_source_id:
                  type: integer
                magasin_destination_id:
                  type: integer
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Transférer du stock entre magasins
      tags:
      - Réapprovisionnement
  /stock/:
    get:
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Récupérer tous les produits en stock
      tags:
      - Stock
  /stock/annulation:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                produit_id:
                  type: string
                quantite:
                  type: integer
                magasin_id:
                  type: integer
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Annuler une vente de produit
      tags:
      - Stock
  /stock/rechercher:
    get:
      parameters:
      - in: query
        name: terme
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Succès
      
      security:
      - ApiKeyAuth: []
      summary: Rechercher un produit
      tags:
      - Stock
  /stock/update/{produit_id}/magasin/{magasin_id}:
    put:
      parameters:
      - in: path
        name: produit_id
        required: true
        schema:
          type: integer
      - in: path
        name: magasin_id
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom:
                  type: string
                categorie:
                  type: string
                prix:
                  type: float
                quantite:
                  type: integer
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Mettre à jour le stock d'un produit dans un magasin
      tags:
      - Stock
  /stock/vente:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                produit_id:
                  type: string
                quantite:
                  type: integer
                magasin_id:
                  type: integer
      responses:
        '200':
          description: Succès
      security:
      - ApiKeyAuth: []
      summary: Enregistrer une vente de produit
      tags:
      - Stock
security:
- ApiKeyAuth: []
servers:
- url: http://localhost:8082
